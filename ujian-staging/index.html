<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian sambungan Fasiliti — data rekaan</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#0d1524;color:#eef}button{padding:14px;margin:8px;background:#81e4bc;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172238;padding:20px}</style><h1>Ujian sambungan Fasiliti</h1><p>Data rekaan sahaja. Tiada tempahan atau emel sebenar. Preview synthetic aktif; sistem utama kekal pada versi asal.</p><button id="read">Uji bacaan</button><button id="submit">Uji simpan dan retry</button><pre id="result" role="status">Belum diuji</pre><script>
const API_URL='https://script.google.com/macros/s/AKfycbwVRJLkSXq73M5RBzWxaxcczYIUG1prgRVbecV2Spwnq8AZA3QlMTD0Wi5dycHU0CgfQg/exec'; // Isi hanya selepas kelulusan deployment synthetic; jangan guna URL produksi/private v4.
const result=document.getElementById('result');
async function request(action,payload){if(!API_URL)throw Error('Preview belum diterbitkan');const control=new AbortController(),timer=setTimeout(()=>control.abort(),30000);let response;try{response=await fetch(API_URL+(action==='submit'?'':'?action='+action),action==='submit'?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),signal:control.signal}:{signal:control.signal});}finally{clearTimeout(timer);}if(!response.ok)throw Error('HTTP '+response.status);return response.json();}
document.getElementById('read').onclick=async()=>{try{const d=await request('getAppData');if(d.apiVersion!==2||d.fasilitiList?.[0]?.nama!=='Fasiliti Ujian')throw Error('Respons fixture tidak sepadan');result.textContent='BACA PASS\n'+JSON.stringify(d,null,2);}catch(e){result.textContent='GAGAL: '+e.message;}};
document.getElementById('submit').onclick=async()=>{const button=document.getElementById('submit');button.disabled=true;try{const requestId='37fb336f-29ce-4222-973a-4922298fddd7';sessionStorage.setItem('synthetic-facility-request',requestId);const p={requestId,fasiliti:'Fasiliti Ujian',nama_program:'UJIAN GITHUB - BUKAN TEMPAHAN SEBENAR',nama_pemohon:'Pemohon Ujian',no_hp:'0000000000',email:'staging@example.invalid',sektor:'Sektor Ujian',organisasi:'Organisasi Ujian',tujuan:'Tujuan Ujian',tarikh_mula:'2099-04-01',tarikh_akhir:'2099-04-01',bil_peserta:1,bookingItems:[{tarikh:'2099-04-01',slots:['Slot 1: 08:00 - 10:00']}]};const first=await request('submit',p);if(first.result!=='success'||first.mailStatus!=='DRY_RUN')throw Error(JSON.stringify(first));result.textContent='RESIT DITERIMA\n'+JSON.stringify(first,null,2)+'\nMenyemak retry…';const retry=await request('submit',p);if(retry.id!==first.id||retry.duplicate!==true)throw Error('Retry tidak sepadan');result.textContent='SIMPAN DAN RETRY PASS\n'+JSON.stringify({first,retry},null,2);}catch(e){result.textContent='GAGAL: '+e.message;}finally{button.disabled=false;}};
</script></html>
